<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Espace réservé — HMA</title>

    <!-- Polices Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <!-- ===== FEUILLE DE STYLE EXTERNE ===== -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Éléments de fond flottants -->
    <div class="bg-blur bg-blur--1"></div>
    <div class="bg-blur bg-blur--2"></div>

    <div class="container">
        <!-- LOGO -->
        <div class="logo-wrapper">
            <img src="./HMA1.png" alt="Logo HMA" class="logo" id="logo" />
        </div>

        <!-- TITRE -->
        <h1 id="title">Espace réservé</h1>

        <!-- BADGE -->
        <div class="badge" id="badge">
            <i class="fas fa-code"></i> <span id="badgeText">En développement</span>
        </div>

        <!-- DESCRIPTION -->
        <p id="description">
            Une nouvelle expérience se prépare.<br />
            Nous vous dévoilons très prochainement ce projet unique.
        </p>

        <!-- SÉPARATEUR AVEC DIAMANT -->
        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-diamond"><i class="fas fa-gem"></i></span>
            <span class="divider-line"></span>
        </div>

        <!-- HORLOGE (AJOUT JS) -->
        <div class="clock" id="clock">
            <i class="far fa-clock"></i> <span id="timeDisplay">--:--:--</span>
        </div>

        <!-- COMPTEUR DE VISITES (AJOUT JS) -->
        <div class="visitor-counter" id="visitorCounter">
            <i class="fas fa-eye"></i> <span id="visitorCount">0</span> visiteurs
        </div>

        <!-- FOOTER -->
        <div class="footer">
            &copy; 2025 — <span class="highlight">HMA</span> — Tous droits réservés
        </div>
    </div>

    <!-- ===== SCRIPT JS EXTERNE ===== -->
    <script src="script.js" defer></script>
</body>
</html>
